name: Renew Instagram key

# Every Wednesday (cron is UTC). Instagram keys last 60 days; renewing weekly keeps
# it fresh with plenty of margin. Also runnable by hand from the Actions tab.
on:
  schedule:
    - cron: "29 16 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests

      - name: Renew and save key
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "GH_SECRETS_TOKEN secret is missing. See README step 5." >&2
            exit 1
          fi
          NEW_TOKEN="$(python refresh_token.py)"
          echo "::add-mask::${NEW_TOKEN}"
          gh secret set IG_ACCESS_TOKEN --repo "${GITHUB_REPOSITORY}" --body "${NEW_TOKEN}"
          echo "IG_ACCESS_TOKEN secret updated."
          if [ -n "${THREADS_TOKEN}" ]; then
            NEW_TH="$(python threads.py --refresh)" && {
              echo "::add-mask::${NEW_TH}"
              gh secret set THREADS_TOKEN --repo "${GITHUB_REPOSITORY}" --body "${NEW_TH}"
              echo "THREADS_TOKEN secret updated."
            } || echo "Threads key renewal failed; Instagram key is still fine."
          fi
          if [ -n "${PINTEREST_REFRESH_TOKEN}" ]; then
            NEW_PIN="$(python pinterest.py --refresh)" && {
              if [ -n "${NEW_PIN}" ]; then
                echo "::add-mask::${NEW_PIN}"
                gh secret set PINTEREST_REFRESH_TOKEN --repo "${GITHUB_REPOSITORY}" --body "${NEW_PIN}"
                echo "PINTEREST_REFRESH_TOKEN secret updated."
              fi
            } || echo "Pinterest key renewal failed; Instagram key is still fine."
          fi
