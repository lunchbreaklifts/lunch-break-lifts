name: Comments and daily summary

# Replies to comments in the morning and ~30 and ~90 min after each post (cron is UTC).
# The 8pm run also sends the daily summary as a GitHub issue (you get a notification).
on:
  schedule:
    - cron: "11 15 * * *"   # morning
    - cron: "57 19 * * *"   # ~30 min after the lunch post usually lands
    - cron: "57 20 * * *"   # ~90 min after
    - cron: "7 2 * * *"     # ~30 min after the evening post + nightly summary
    - cron: "7 3 * * *"     # ~90 min after the evening post
  workflow_dispatch:
    inputs:
      summary:
        description: "Also send the daily summary"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: content-pipeline
  cancel-in-progress: false

jobs:
  engage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install anthropic requests

      - name: Reply to comments
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FORGET_USERS: ${{ secrets.FORGET_USERS }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          WANT_SUMMARY: ${{ github.event.schedule == '7 2 * * *' || inputs.summary == true }}
        run: |
          if [ "$WANT_SUMMARY" = "true" ]; then
            python insights.py || true   # fresh numbers for the summary and the report page
            python engage.py --summary
            python report.py || true
          else
            python engage.py
          fi

      - name: Send daily summary
        if: ${{ hashFiles('summary.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "Daily summary $(TZ=America/Denver date +'%a %b %-d')" --body-file summary.md --assignee "$GITHUB_REPOSITORY_OWNER")
          gh issue close "$url" --repo "$GITHUB_REPOSITORY"
          rm summary.md

      - name: Save state
        run: |
          git config user.name "content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add engage_state.json stats.csv report/index.html 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Comment replies"
          git pull --rebase
          git push
