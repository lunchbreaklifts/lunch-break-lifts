name: Comments and daily summary

# Replies to new comments 3 times a day (Denver: ~9am, ~3pm, ~8pm; cron is UTC).
# The 8pm run also sends the daily summary as a GitHub issue (you get a notification).
on:
  schedule:
    - cron: "11 15 * * *"
    - cron: "11 21 * * *"
    - cron: "7 2 * * *"
  workflow_dispatch:
    inputs:
      summary:
        description: "Also send the daily summary"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: content-pipeline
  cancel-in-progress: false

jobs:
  engage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install anthropic requests

      - name: Reply to comments
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          WANT_SUMMARY: ${{ github.event.schedule == '7 2 * * *' || inputs.summary == true }}
        run: |
          if [ "$WANT_SUMMARY" = "true" ]; then
            python engage.py --summary
          else
            python engage.py
          fi

      - name: Send daily summary
        if: ${{ hashFiles('summary.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "Daily summary $(TZ=America/Denver date +'%a %b %-d')" --body-file summary.md --assignee "$GITHUB_REPOSITORY_OWNER")
          gh issue close "$url" --repo "$GITHUB_REPOSITORY"
          rm summary.md

      - name: Save state
        run: |
          git config user.name "content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add engage_state.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Comment replies"
          git pull --rebase
          git push
