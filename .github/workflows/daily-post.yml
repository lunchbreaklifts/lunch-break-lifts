name: Daily post

# Twice a day, lunch and evening, Denver time (cron is UTC).
# Also runnable by hand from the Actions tab. At most posts_per_day posts, at least 4h apart.
on:
  schedule:
    - cron: "43 18 * * *"   # lunch: ~11:43am MST / 12:43pm MDT (GitHub usually starts 30-45 min late)
    - cron: "47 0 * * *"    # evening: ~5:47pm MST / 6:47pm MDT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-pipeline
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests anthropic

      - name: Publish next post
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python publish.py

      - name: Save to repo
        run: |
          git config user.name "content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Published post"
          git pull --rebase
          git push
