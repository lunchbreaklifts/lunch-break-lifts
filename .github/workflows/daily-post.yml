name: Daily post

# Every day around lunchtime Denver time: 11:43 in winter, 12:43 in summer (cron is UTC).
# Also runnable by hand from the Actions tab. Posts at most once per day.
on:
  schedule:
    - cron: "43 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-pipeline
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests

      - name: Publish next post
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python publish.py

      - name: Save to repo
        run: |
          git config user.name "content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Published post"
          git pull --rebase
          git push
