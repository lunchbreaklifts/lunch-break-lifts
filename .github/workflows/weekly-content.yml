name: Weekly content

# Sundays around 8-9am Denver time (cron is UTC). Also runnable by hand from the Actions tab.
on:
  schedule:
    - cron: "17 15 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-pipeline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Check how past posts did
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python insights.py

      - name: Generate posts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_ideas.py

      - name: Render slides
        run: python render_slides.py --stories

      - name: Save to repo
        run: |
          git config user.name "content-bot"
          git config user.email "content-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Weekly content batch"
          git pull --rebase
          git push
